name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fpdf2 pytest

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check VOLADURA_PRO_10X/ --ignore=E402,F401,F811 --line-length=120 || true

      - name: Test Phase 1
        working-directory: VOLADURA_PRO_10X
        run: python test_phase1.py

      - name: Test Phase 2 Physics
        working-directory: VOLADURA_PRO_10X
        run: python test_phase2_physics.py

      - name: Test Reports
        working-directory: VOLADURA_PRO_10X
        run: python test_phase4_reports.py

      - name: Install PyVista (headless)
        run: pip install pyvista pyvistaqt

      - name: Test advanced physics
        working-directory: VOLADURA_PRO_10X
        run: python test_advanced_physics.py
