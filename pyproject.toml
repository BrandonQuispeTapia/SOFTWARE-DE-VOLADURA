[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xblast"
version = "3.0.0"
description = "Plataforma de diseno, simulacion y optimizacion de voladura de rocas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.5",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.gui-scripts]
xblast = "xblast.app:main"

[tool.setuptools.packages.find]
include = ["xblast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
